name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas-y-build:
    name: Pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar código (ESLint)
        run: npm run lint

      - name: Revisar formato (Prettier)
        run: npm run format:check

      - name: Correr pruebas (Vitest)
        run: npm test

      - name: Build de producción
        run: npm run build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas-y-build:
    name: Pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar código (ESLint)
        run: npm run lint

      - name: Revisar formato (Prettier)
        run: npm run format:check

      - name: Revisar tipos (TypeScript)
        run: npm run typecheck

      - name: Correr pruebas (Vitest)
        run: npm test

      - name: Build de producción
        run: npm run build

  capa-de-datos:
    name: Capa de datos (emuladores de Firebase)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # El emulador de Firestore corre sobre Java.
      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Guardar en caché los emuladores
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emuladores-firebase-${{ runner.os }}

      - name: Instalar dependencias y Firebase CLI
        run: |
          npm ci
          npm install -g firebase-tools

      - name: Probar sets.js y firestore.rules contra los emuladores
        run: npm run test:firebase:ci
